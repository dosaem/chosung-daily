<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>오늘의 초성</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="card">
    <header class="header">
      <h1>오늘의 초성</h1>
      <p id="streak" class="streak">🔥 -</p>
    </header>

    <section class="account">
      <button id="google-login-button" type="button" class="link-button">구글로 로그인</button>
      <button id="apple-login-button" type="button" class="link-button">Apple로 로그인</button>
      <button id="backup-button" type="button" class="link-button">내 기록 백업</button>
      <button id="restore-button" type="button" class="link-button">다른 기기 기록 불러오기</button>
    </section>

    <div id="backup-panel" class="panel hidden">
      <p class="panel-desc">이 코드를 저장해두면 다른 기기에서도 같은 기록으로 이어할 수 있어요.</p>
      <div class="token-row">
        <input id="token-display" type="text" readonly />
        <button id="copy-token-button" type="button">복사</button>
      </div>
      <p id="copy-token-done" class="copied hidden">복사했어요!</p>
    </div>

    <div id="restore-panel" class="panel hidden">
      <p class="panel-desc">백업해둔 코드를 붙여넣으면 그 기록을 이 기기로 가져와요.</p>
      <div class="token-row">
        <input id="token-input" type="text" placeholder="백업 코드 붙여넣기" autocomplete="off" />
        <button id="restore-submit-button" type="button">불러오기</button>
      </div>
      <p id="restore-message" class="message"></p>
    </div>

    <section id="puzzle" class="puzzle">
      <p id="date" class="date"></p>
      <p id="category" class="category"></p>
      <p id="chosung" class="chosung">...</p>
      <p id="attempts-left" class="attempts-left"></p>
    </section>

    <section id="history" class="history"></section>

    <form id="guess-form" class="guess-form">
      <input
        id="guess-input"
        type="text"
        autocomplete="off"
        placeholder="정답을 입력하세요"
      />
      <button type="submit">제출</button>
    </form>

    <p id="hint" class="hint"></p>
    <p id="message" class="message"></p>

    <section id="result" class="result hidden">
      <p id="result-text" class="result-text"></p>
      <button id="share-button" type="button">결과 공유하기</button>
      <p id="share-copied" class="copied hidden">클립보드에 복사했어요!</p>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
