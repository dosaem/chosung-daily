<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>오늘의 초성</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter,+Pretendard,+system-ui,+sans-serif:wght@100..900&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "bg-custom": "#141A26",
            "surface-custom": "#1C2433",
            "surface-tile": "#253044",
            "text-main": "#F1F5F9",
            "text-secondary": "#94A3B8",
            "border-custom": "#2A3447",
            "primary-orange": "#F97316",
            "correct-green": "#22C55E",
            "correct-text": "#052E16",
            "wrong-gray": "#475569"
          },
          fontFamily: {
            sans: ['Inter', 'Pretendard', 'sans-serif']
          }
        }
      }
    }
</script>
<style>
    body {
      min-height: max(884px, 100dvh);
      background-color: #141A26;
      color: #F1F5F9;
    }
</style>
</head>
<body class="bg-[#141A26] text-[#F1F5F9] font-sans antialiased">
<div class="min-h-screen flex flex-col max-w-[480px] mx-auto pb-32">
<!-- TopAppBar -->
<header class="bg-[#141A26] text-[#F1F5F9] border-b border-[#2A3447] flex justify-between items-center w-full max-w-[480px] mx-auto px-4 h-14 z-40 sticky top-0">
<div class="text-[20px] font-bold text-[#F1F5F9] tracking-tight">오늘의 초성</div>
<div class="flex items-center gap-1.5 bg-[#1C2433] px-3 py-1 rounded-full border border-[#2A3447]">
<span class="material-symbols-outlined text-[#F97316] text-sm" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="text-xs text-[#F1F5F9] font-bold">7</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-4 py-4 flex flex-col gap-4">
<!-- Date Line & Chip -->
<div class="flex items-center justify-between">
<div class="text-sm text-[#94A3B8] font-medium">10월 13일 · 일반 단어</div>
<div class="bg-[#1C2433] border border-[#2A3447] px-2.5 py-1 rounded-md text-[11px] font-semibold text-[#94A3B8] tracking-wider">
          KST 00:00 새 퍼즐
        </div>
</div>
<!-- Puzzle Header Row -->
<div class="bg-[#1C2433] border border-[#2A3447] rounded-xl p-4 flex flex-col items-center gap-3">
<div class="text-xs font-semibold text-[#94A3B8] uppercase tracking-wider">오늘의 초성 퀴즈</div>
<div class="flex gap-2">
<div class="w-12 h-12 rounded-lg bg-[#253044] border border-[#2A3447] flex items-center justify-center text-[28px] font-bold text-[#F1F5F9]">ㅈ</div>
<div class="w-12 h-12 rounded-lg bg-[#253044] border border-[#2A3447] flex items-center justify-center text-[28px] font-bold text-[#F1F5F9]">ㅎ</div>
<div class="w-12 h-12 rounded-lg bg-[#253044] border border-[#2A3447] flex items-center justify-center text-[28px] font-bold text-[#F1F5F9]">ㅊ</div>
<div class="w-12 h-12 rounded-lg bg-[#253044] border border-[#2A3447] flex items-center justify-center text-[28px] font-bold text-[#F1F5F9]">ㅇ</div>
</div>
<div class="text-xs text-[#94A3B8] font-medium">4글자</div>
</div>
<!-- Attempt Rows -->
<div class="flex flex-col gap-2">
<!-- Row 1: 지하철역 -->
<div class="grid grid-cols-4 gap-2">
<div class="h-12 rounded-lg bg-[#22C55E] flex items-center justify-center text-[20px] text-[#052E16] font-bold relative">
            지
            <span class="absolute top-1 right-1 material-symbols-outlined text-[#052E16] text-[14px]">check</span>
</div>
<div class="h-12 rounded-lg bg-[#22C55E] flex items-center justify-center text-[20px] text-[#052E16] font-bold relative">
            하
            <span class="absolute top-1 right-1 material-symbols-outlined text-[#052E16] text-[14px]">check</span>
</div>
<div class="h-12 rounded-lg bg-[#475569] flex items-center justify-center text-[20px] text-[#F1F5F9] font-bold">철</div>
<div class="h-12 rounded-lg bg-[#475569] flex items-center justify-center text-[20px] text-[#F1F5F9] font-bold">역</div>
</div>
<!-- Row 2: 자하촌역 -->
<div class="grid grid-cols-4 gap-2">
<div class="h-12 rounded-lg bg-[#22C55E] flex items-center justify-center text-[20px] text-[#052E16] font-bold relative">
            자
            <span class="absolute top-1 right-1 material-symbols-outlined text-[#052E16] text-[14px]">check</span>
</div>
<div class="h-12 rounded-lg bg-[#475569] flex items-center justify-center text-[20px] text-[#F1F5F9] font-bold">하</div>
<div class="h-12 rounded-lg bg-[#475569] flex items-center justify-center text-[20px] text-[#F1F5F9] font-bold">촌</div>
<div class="h-12 rounded-lg bg-[#22C55E] flex items-center justify-center text-[20px] text-[#052E16] font-bold relative">
            역
            <span class="absolute top-1 right-1 material-symbols-outlined text-[#052E16] text-[14px]">check</span>
</div>
</div>
<!-- Row 3 -->
<div class="grid grid-cols-4 gap-2">
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
</div>
<!-- Row 4 -->
<div class="grid grid-cols-4 gap-2">
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
</div>
<!-- Row 5 -->
<div class="grid grid-cols-4 gap-2">
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
<div class="h-12 rounded-lg bg-[#253044] border border-[#2A3447]"></div>
</div>
</div>
<!-- Hint Card -->
<div class="bg-[#1C2433] border border-[#2A3447] rounded-xl p-4 flex flex-col gap-3">
<div class="flex items-center gap-2 text-[#94A3B8]">
<span class="material-symbols-outlined text-base">lock</span>
<span class="text-sm text-[#94A3B8] font-medium">힌트는 3번째 오답 후 열려요</span>
</div>
<button class="w-full py-2.5 px-4 rounded-lg border border-[#2A3447] bg-transparent text-[#94A3B8] text-sm font-medium flex items-center justify-center gap-2 hover:bg-[#253044] transition-colors">
<span class="material-symbols-outlined text-sm">play_arrow</span>
          광고 보고 힌트 미리 보기
        </button>
</div>
<!-- Input Area & Submit -->
<div class="flex flex-col gap-2">
<div class="relative flex items-center">
<input class="w-full bg-[#1C2433] border border-[#2A3447] rounded-lg px-4 py-3 text-[#F1F5F9] placeholder:text-[#94A3B8] focus:border-[#F97316] focus:outline-none text-base" maxlength="4" placeholder="정답을 입력하세요" type="text"/>
<span class="absolute right-4 text-xs font-semibold text-[#94A3B8]">0/4</span>
</div>
<div class="flex items-center justify-between text-xs text-[#94A3B8] px-1">
<span>남은 기회 3/5</span>
<span class="text-[#F97316] font-medium">초성 맞추기</span>
</div>
<button class="w-full bg-[#F1F5F9] text-[#0F172A] py-3.5 rounded-lg font-bold tracking-tight hover:opacity-95 transition-opacity mt-1 text-base">
          제출
        </button>
</div>
</main>
<!-- Fixed Bottom Navigation & Ad Banner Container -->
<div class="fixed bottom-0 left-0 w-full z-50 flex flex-col max-w-[480px] right-0 mx-auto">
<!-- Reserved 50px banner ad slot -->
<div class="w-full h-[50px] bg-[#1C2433] border-t border-[#2A3447] flex items-center justify-center">
<span class="text-xs text-[#94A3B8] font-medium tracking-widest uppercase">광고</span>
</div>
<!-- BottomNavBar -->
<nav class="bg-[#1C2433] border-t border-[#2A3447] flex justify-around items-center px-4 py-1">
<!-- Tab 1: 오늘 (Active) -->
<a class="flex flex-col items-center justify-center text-[#F1F5F9] py-1 flex-1 relative border-t-2 border-[#F97316]" href="#">
<span class="material-symbols-outlined text-xl text-[#F97316]" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<span class="text-xs mt-1 font-semibold text-[#F1F5F9]">오늘</span>
</a>
<!-- Tab 2: 순위 -->
<a class="flex flex-col items-center justify-center text-[#94A3B8] hover:text-[#F1F5F9] transition-colors py-1 flex-1 border-t-2 border-transparent" href="#">
<span class="material-symbols-outlined text-xl">leaderboard</span>
<span class="text-xs mt-1 font-medium">순위</span>
</a>
<!-- Tab 3: 내 기록 -->
<a class="flex flex-col items-center justify-center text-[#94A3B8] hover:text-[#F1F5F9] transition-colors py-1 flex-1 border-t-2 border-transparent" href="#">
<span class="material-symbols-outlined text-xl">inventory_2</span>
<span class="text-xs mt-1 font-medium">내 기록</span>
</a>
</nav>
</div>
</div>
</body></html>
