name: App Store Metadata

# App Store Connect 메타데이터·스크린샷만 올린다(바이너리 제외).
# `mobile/ios/fastlane/metadata` + `mobile/ios/fastlane/screenshots` 가 그대로
# 올라간다 — 스크린샷은 `scripts/store_screenshots.sh` 가 만들어 커밋한 파일이다.
# 수동 트리거 전용: gh workflow run appstore-metadata.yml
#
# BASELINE(~/Code/BuildUrPalace/.github/workflows/appstore-metadata.yml)을 복사해
# 식별자(`app_identifier`·`app_version`)와 경로(`mobile/ios`)만 바꿨다.

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: '메타데이터를 반영할 버전 (pubspec.yaml 의 version 과 같아야 한다)'
        required: false
        default: '1.0.0'

jobs:
  deliver:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: mobile/ios

    steps:
      - uses: actions/checkout@v4

      - name: Create App Store Connect API key file
        env:
          API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          if [ -z "$API_KEY_JSON" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY secret 이 없다 (docs/RELEASE.md '34.' D2)"
            exit 1
          fi
          echo "$API_KEY_JSON" > fastlane/api_key.json

      - name: Verify fastlane
        run: |
          if ! command -v fastlane &> /dev/null; then
            brew install fastlane
          fi
          fastlane --version

      # 스크린샷이 없으면 deliver 가 "업로드할 게 없다" 고 조용히 지나간다 —
      # iPad 스크린샷 없이 제출하면 심사가 막히므로(BASELINE 1.0.0 반려 원인)
      # 올리기 전에 폴더를 직접 센다.
      - name: Check screenshots exist
        env:
          APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
        run: |
          count=$(find fastlane/screenshots -name '*.png' | wc -l | tr -d ' ')
          echo "screenshots: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::fastlane/screenshots 가 비었다 — scripts/store_screenshots.sh 를 먼저 돌린다 (docs/RELEASE.md '35.')"
            exit 1
          fi

      - name: Upload metadata & screenshots
        env:
          APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
        run: |
          fastlane deliver \
            --api_key_path fastlane/api_key.json \
            --app_identifier com.dosaem.chosung \
            --app_version "$APP_VERSION" \
            --skip_binary_upload \
            --overwrite_screenshots \
            --precheck_include_in_app_purchases false \
            --force

      - name: Cleanup key
        if: always()
        run: rm -f fastlane/api_key.json
