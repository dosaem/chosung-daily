# 임시 진단 — claude-sentry.yml 의 Claude 실행이 0.5초 만에 is_error 로 끝나는 원인을 보려고
# Action 을 거치지 않고 CLI 를 직접 돌린다. 원인 확인 뒤 삭제한다(티켓 51).
name: Claude Diagnose
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run claude -p once (stderr shown)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "key length: ${#ANTHROPIC_API_KEY}"
          claude --version
          set +e
          claude -p "Reply with the single word OK." --model claude-opus-5-5 --max-turns 2 --output-format json > out.json 2> err.txt
          echo "exit=$?"
          echo "--- stderr"; cat err.txt | sed 's/sk-ant-[A-Za-z0-9_-]*/sk-ant-REDACTED/g'
          echo "--- stdout"; cat out.json | sed 's/sk-ant-[A-Za-z0-9_-]*/sk-ant-REDACTED/g' | head -c 2000
