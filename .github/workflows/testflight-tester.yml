name: TestFlight Tester

# TestFlight 내부 테스터 등록 — 내부 베타 그룹(모든 빌드 자동 접근)을 찾거나
# 만들고 그 그룹에 이메일 하나를 넣는다. 내부 그룹이라 테스터는 **ASC 팀 멤버**
# 여야 한다(외부 그룹은 베타 심사를 받는다 — 여기서 다루지 않는다).
#
# 사용: gh workflow run testflight-tester.yml [-f email=someone@example.com]
#
# 이메일을 레포에 적지 않는다 — 입력을 비우면 `vars.TESTFLIGHT_TESTER_EMAIL` 을
# 쓰고, 둘 다 비면 멈춘다. BASELINE 은 운영자 주소를 워크플로 기본값에 박아
# 뒀는데, 공개 레포에 개인 주소를 커밋하지 않으려고 variable 로 옮겼다
# (`asc-submit.yml` 이 심사 연락처를 secret 으로 옮긴 것과 같은 이유).
#
# BASELINE: ~/Code/BuildUrPalace/.github/workflows/testflight-tester.yml.
# fastlane 용 `api_key.json` 은 만들지 않는다. JWT 서명용 P8 임시 파일은 서명 직후
# 지운다(이유는 `asc-status.yml` 머리말).

on:
  workflow_dispatch:
    inputs:
      email:
        description: '테스터 이메일 (비우면 vars.TESTFLIGHT_TESTER_EMAIL). ASC 팀 멤버여야 한다 — 내부 그룹'
        required: false
        default: ''

jobs:
  add-tester:
    runs-on: self-hosted
    steps:
      - name: Add internal tester via App Store Connect API
        env:
          API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          TESTER_EMAIL: ${{ github.event.inputs.email || vars.TESTFLIGHT_TESTER_EMAIL }}
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, subprocess, sys, tempfile, time, urllib.error, urllib.parse, urllib.request

          raw = os.environ.get('API_KEY_JSON', '').strip()
          if not raw:
              print("::error::APP_STORE_CONNECT_API_KEY secret 이 없다 (docs/RELEASE.md '34.' D2)")
              sys.exit(1)
          d = json.loads(raw)
          email = os.environ.get('TESTER_EMAIL', '').strip()
          if not email:
              print('::error::테스터 이메일이 없다 — -f email=… 이나 '
                    'vars.TESTFLIGHT_TESTER_EMAIL 을 채운다 (docs/RELEASE.md \'41.\')')
              sys.exit(1)
          BUNDLE_ID = 'com.dosaem.chosung'

          def b64(obj):
              return base64.urlsafe_b64encode(json.dumps(obj, separators=(',', ':')).encode()).rstrip(b'=')

          def der_to_raw(der):
              assert der[0] == 0x30
              idx = 2
              assert der[idx] == 0x02; idx += 1
              rlen = der[idx]; idx += 1
              r = der[idx:idx+rlen].lstrip(b'\x00'); idx += rlen
              assert der[idx] == 0x02; idx += 1
              slen = der[idx]; idx += 1
              s = der[idx:idx+slen].lstrip(b'\x00')
              return r.rjust(32, b'\x00') + s.rjust(32, b'\x00')

          def token():
              now = int(time.time())
              si = b64({'alg': 'ES256', 'kid': d['key_id'], 'typ': 'JWT'}) + b'.' + \
                  b64({'iss': d['issuer_id'], 'iat': now, 'exp': now + 900, 'aud': 'appstoreconnect-v1'})
              # P8 를 디스크에 잠깐 쓴다 — `openssl dgst -sign` 이 파일 경로만 받는다.
              # try/finally 가 아니면 openssl 이 없거나 죽었을 때 키가 self-hosted 맥에
              # 그대로 남는다(D-41-1). 잡이 끝나도 호스트는 폐기되지 않는다.
              with tempfile.NamedTemporaryFile('w', suffix='.p8', delete=False) as f:
                  f.write(d['key']); kp = f.name
              try:
                  sig = subprocess.run(['openssl', 'dgst', '-sha256', '-sign', kp],
                                       input=si, capture_output=True).stdout
              finally:
                  os.unlink(kp)
              return (si + b'.' + base64.urlsafe_b64encode(der_to_raw(sig)).rstrip(b'=')).decode()

          TOKEN = token()
          BASE = 'https://api.appstoreconnect.apple.com'

          def api(method, path, body=None, ok=()):
              req = urllib.request.Request(
                  BASE + path,
                  data=json.dumps(body).encode() if body else None,
                  headers={'Authorization': f'Bearer {TOKEN}', 'Content-Type': 'application/json'},
                  method=method)
              try:
                  resp = urllib.request.urlopen(req)
                  payload = resp.read()
                  return json.loads(payload) if payload else {}
              except urllib.error.HTTPError as e:
                  detail = e.read().decode()
                  print(f'{method} {path} -> HTTP {e.code}: {detail[:600]}', file=sys.stderr)
                  if e.code in ok:
                      return None
                  raise

          apps = api('GET', f'/v1/apps?filter[bundleId]={BUNDLE_ID}')
          if not apps['data']:
              print(f"::error::ASC 에 {BUNDLE_ID} 앱이 없다 — 먼저 앱을 만든다 (docs/RELEASE.md '35.')")
              sys.exit(1)
          app_id = apps['data'][0]['id']
          print(f'app: {app_id} ({BUNDLE_ID})')

          groups = api('GET', f'/v1/betaGroups?filter[app]={app_id}&filter[isInternalGroup]=true')
          if groups['data']:
              group_id = groups['data'][0]['id']
              print(f"existing internal group: {groups['data'][0]['attributes']['name']} ({group_id})")
          else:
              g = api('POST', '/v1/betaGroups', {
                  'data': {
                      'type': 'betaGroups',
                      'attributes': {
                          'name': 'Internal Testers',
                          'isInternalGroup': True,
                          'hasAccessToAllBuilds': True,
                      },
                      'relationships': {'app': {'data': {'type': 'apps', 'id': app_id}}},
                  }})
              group_id = g['data']['id']
              print(f'created internal group: {group_id}')

          # 이미 등록된 테스터를 다시 넣으면 409 다 — 다시 돌릴 수 있어야 하므로
          # 실패로 보지 않고, 그 자리에서 그룹에 붙이기만 한다(그룹이 새로 생긴
          # 경우에는 기존 테스터가 그 그룹에 없다).
          added = api('POST', '/v1/betaTesters', {
              'data': {
                  'type': 'betaTesters',
                  'attributes': {'email': email},
                  'relationships': {'betaGroups': {'data': [{'type': 'betaGroups', 'id': group_id}]}},
              }}, ok=(409,))
          if added:
              print(f"tester added: {email} -> {added['data']['id']}")
              sys.exit(0)

          q = urllib.parse.quote(email)
          existing = api('GET', f'/v1/betaTesters?filter[email]={q}&filter[apps]={app_id}')
          if not existing['data']:
              print(f'::error::{email} 등록이 409 인데 조회에도 없다 — ASC 콘솔에서 확인한다')
              sys.exit(1)
          tester_id = existing['data'][0]['id']
          api('POST', f'/v1/betaGroups/{group_id}/relationships/betaTesters', {
              'data': [{'type': 'betaTesters', 'id': tester_id}]})
          print(f'tester already existed: {email} -> {tester_id}, 그룹 {group_id} 에 붙였다')
          PYEOF
