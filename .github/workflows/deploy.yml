# CI 가 통과한 커밋만 NAS 에 올린다 — main → prod, develop → develop.
#
# workflow_run 을 쓰는 이유: CI 와 배포를 한 워크플로에 `needs` 로 붙이면 PR 에서도
# 배포 잡이 평가돼 조건식이 늘어난다. 여기서는 "CI 가 main/develop 에서 성공했을 때만"
# 이라는 조건 하나로 끝난다. 대신 workflow_run 은 기본 브랜치 기준으로 돌기 때문에
# 체크아웃과 배포 대상을 이벤트의 head_sha·head_branch 로 명시해야 한다.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    # main 이 아닌 브랜치는 트리거의 branches 필터가 develop 만 통과시킨다.
    env:
      TARGET: ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'develop' }}
      # NAS 가 빌드할 커밋. 러너 checkout 만 head_sha 로 맞추면 NAS 는 자기 git 으로
      # "지금의 브랜치 끝" 을 가져와서 CI 를 안 거친 커밋을 빌드할 수 있다.
      CI_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # NAS 는 인터넷에 ssh 를 열지 않는다(Cloudflare Tunnel 로 HTTP 만 공개).
      # 러너를 tailnet 에 임시로 넣어서 NAS 에 붙는다.
      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NAS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # 스크립트를 표준입력으로 흘려보낸다 — NAS 체크아웃의 deploy.sh 를 실행하면
      # 그 안의 git merge 가 실행 중인 자기 자신을 갈아치운다(README "설계 판단" §20).
      # 이렇게 하면 항상 방금 CI 를 통과한 커밋의 스크립트가 돈다.
      #
      # sha 를 같이 넘겨서 NAS 가 빌드하는 커밋도 그 커밋으로 못박는다. 그 사이
      # 브랜치가 움직였으면 스크립트가 배포를 중단하고(빨갛게 끝난다) 새 커밋은
      # 자기 CI 가 통과한 뒤 자기 배포로 올라간다.
      - name: Deploy to NAS
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "${{ secrets.NAS_SSH_USER }}@${{ secrets.NAS_SSH_HOST }}" \
            "bash -s -- $TARGET $CI_SHA" < deploy/deploy.sh
