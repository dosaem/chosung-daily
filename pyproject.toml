[project]
name = "chosung-daily"
version = "0.1.0"
description = "하루에 한 문제, 초성을 보고 단어를 맞추는 웹 게임 백엔드"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=26.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pymysql>=1.2.3",
    "redis>=8.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
