name: chosung
description: "오늘의 초성 / Hidden Vowels — 하루 한 문제 초성 맞추기 앱."
publish_to: 'none'

# 앱 버전. /api/v1/config 의 min_app_version 과 비교하는 "현재 버전" 은
# package_info_plus 가 이 값을 런타임에 읽어온다 (lib/startup/app_version.dart).
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  # S4 "알림 꺼짐 — 시스템 설정에서 켜기" 가 여는 OS 설정 화면(티켓 30).
  # 8·9.x 는 Swift Package Manager 전용이라 CocoaPods 인 이 프로젝트에서
  # `flutter pub get` 이 경고를 내고 iOS 빌드가 깨진다 — 7.x 로 고정한다.
  app_settings: ^7.0.0
  app_tracking_transparency: ^2.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  easy_localization: ^3.0.8
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  # `timezone` 패키지는 기기의 IANA 시간대 이름을 알려주지 않는다(플랫폼 채널이
  # 필요하다). 알림을 "로컬 09:00" 에 걸려면 그 이름이 있어야 한다(티켓 30).
  flutter_timezone: ^5.1.1
  go_router: ^17.5.0
  google_mobile_ads: ^9.1.0
  google_sign_in: ^7.2.0
  lucide_icons: ^0.257.0
  package_info_plus: ^10.2.2
  sentry_flutter: ^9.30.1
  share_plus: ^13.3.1
  # 온보딩 완료 플래그처럼 "비밀이 아닌 기기 로컬 설정" 자리(티켓 28).
  # easy_localization 초기화도 내부에서 이걸 읽는다.
  shared_preferences: ^2.5.4
  sign_in_with_apple: ^7.0.1
  # `zonedSchedule` 이 받는 TZDateTime. flutter_local_notifications 의 전이
  # 의존성이지만 직접 쓰므로 직접 의존성으로도 적는다(depend_on_referenced_packages).
  timezone: ^0.11.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  # 스토어 스크린샷은 시뮬레이터에서 실제 앱 트리를 띄워 찍는다(티켓 35) —
  # `flutter drive` 가 integration_test 의 takeScreenshot 바이트를 드라이버로 넘긴다.
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icon/

  # OVERRIDES §3: 본문·UI·타일 모두 Pretendard. 가변 폰트 대신 정적 3종을 쓴다 —
  # Flutter 는 fontWeight 로 에셋을 골라주므로 가변 축(wght)을 TextStyle 마다
  # fontVariations 로 지정할 필요가 없다. 라이선스는 OFL(assets/fonts/Pretendard-LICENSE.txt).
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700

# 앱 아이콘·스플래시(티켓 35). **원본은 `assets/icon/app_icon.svg` 한 장**이고
# PNG 는 `python3 tool/make_app_icon.py` 가 그 SVG 에서 만든다. 콘셉트는
# OVERRIDES §8 — 라이트 배경 #FAFAF9 에 글자 없는 타일 3칸.
# 생성: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android adaptive 는 배경·전경을 나눠야 런처가 모양 마스크를 씌울 수 있다 —
  # 배경은 아이콘과 같은 색 한 장, 전경은 투명 배경의 마크(안전 영역 안).
  adaptive_icon_background: "#FAFAF9"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

# 스플래시는 아이콘과 같은 배경 + 같은 마크, **라이트/다크 동일**(OVERRIDES §8).
# 다크 모드에서도 라이트 배경을 쓰는 건 의도다 — 앱 기본 톤이 Editorial Light 라
# 스플래시만 어두우면 첫 프레임에서 화면이 번쩍인다.
# 생성: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FAFAF9"
  image: assets/icon/app_icon_foreground.png
  color_dark: "#FAFAF9"
  image_dark: assets/icon/app_icon_foreground.png
  android_12:
    color: "#FAFAF9"
    image: assets/icon/app_icon_foreground.png
    color_dark: "#FAFAF9"
    image_dark: assets/icon/app_icon_foreground.png
