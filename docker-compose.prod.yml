# ============================================
# PROD / DEVELOP 공용 - Synology NAS (Container Manager)
# prod    : https://chosung.dosaem.com  (8089)
# develop : 8090, 체크아웃 디렉터리 /volume1/docker/chosung-daily-develop
#
# 실행 (프로젝트명·포트·env 파일을 전부 밖에서 준다):
#   prod    : docker compose -f docker-compose.prod.yml -p chosung-daily-prod \
#               --env-file .env up -d --build
#   develop : docker compose -f docker-compose.prod.yml -p chosung-daily-develop \
#               --env-file .env.develop up -d --build
#
# 컨테이너 이름·볼륨 이름은 compose 프로젝트 기본 네이밍(<프로젝트>_<키>)에
# 맡긴다 — container_name이나 최상위 name:을 고정하면 같은 NAS에서 두 인스턴스가
# 이름 충돌로 동시에 못 뜬다. 기존 prod 볼륨(chosung-daily-prod_mysql-data)에
# 그대로 붙으려면 prod는 프로젝트명 chosung-daily-prod를 계속 써야 한다
# (README "설계 판단" §19).
# ============================================

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: chosung_daily
      MYSQL_USER: chosung
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 개발용 compose와 다르게 포트를 호스트에 안 연다 — app/worker/beat
    # 컨테이너가 도커 내부 네트워크로만 접근하면 되고, 외부에 노출할 이유가 없다.
    # named volume을 쓴다 — Synology DSM의 /volume1 ACL이 호스트 bind mount에는
    # 걸리지만 도커가 관리하는 volume에는 안 걸려서, mysql 컨테이너(uid 999)가
    # 쓰기 권한 없이 뻗는 걸 피한다 (alrimi 프로젝트의 postgres도 같은 이유로 동일 패턴).
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://chosung:${MYSQL_PASSWORD}@mysql:3306/chosung_daily?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    # Cloudflare Tunnel이 NAS 안에서 http://127.0.0.1:${APP_PORT}로 붙는다 —
    # LAN/인터넷에 직접 노출할 필요가 없어서 루프백에만 바인딩한다(기존 프로젝트들의
    # 0.0.0.0 공개 바인딩보다 한 단계 더 좁힌 선택, README "배포" 절에 이유 적어둠).
    # prod 8089 / develop 8090 — 포트는 env 파일의 APP_PORT로 갈린다.
    ports:
      - "127.0.0.1:${APP_PORT}:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://chosung:${MYSQL_PASSWORD}@mysql:3306/chosung_daily?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "celery", "-A", "celery_app.celery", "worker", "--loglevel=info"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://chosung:${MYSQL_PASSWORD}@mysql:3306/chosung_daily?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "celery", "-A", "celery_app.celery", "beat", "--loglevel=info"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 매일 04:00 KST mysqldump → gzip, ${BACKUP_DIR} 에 14일 보존, 실패하면 Slack.
  # mysql 과 같은 이미지를 쓴다 — mysqldump·gzip·curl·find 가 전부 들어 있고
  # NAS 가 이미 당겨 둔 이미지라 추가로 받을 게 없다 (README "설계 판단" §21).
  backup:
    image: mysql:8
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      BACKUP_AT: "04:00"
      BACKUP_RETENTION_DAYS: 14
      MYSQL_HOST: mysql
      MYSQL_DATABASE: chosung_daily
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    entrypoint: ["/bin/bash", "/scripts/backup-cron.sh"]
    # 덤프는 named volume 이 아니라 호스트(NAS) 폴더에 둔다 — 컨테이너·볼륨이
    # 날아가도 DSM 파일 탐색기로 꺼낼 수 있어야 백업이다. 이 컨테이너는 root 로
    # 쓰기 때문에 mysql(uid 999)을 괴롭히는 /volume1 ACL 문제가 없다.
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
