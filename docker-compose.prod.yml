# ============================================
# PROD / DEVELOP 공용 - Synology NAS (Container Manager)
# prod    : https://chosung.dosaem.com  (8089)
# develop : 8094, 체크아웃 디렉터리 /volume1/docker/chosung-daily-develop
#
# 배포는 deploy/deploy.sh 가 한다(빌드 → 마이그레이션 → app 롤링 교체 → worker/beat).
# 아래 `up -d --build` 는 처음 올리거나 proxy 로 전환할 때만 쓴다(docs/RELEASE.md §50).
#
# 실행 (프로젝트명·포트·env 파일을 전부 밖에서 준다):
#   prod    : docker compose -f docker-compose.prod.yml -p chosung-daily-prod \
#               --env-file .env up -d --build
#   develop : docker compose -f docker-compose.prod.yml -p chosung-daily-develop \
#               --env-file .env.develop up -d --build
#
# 컨테이너 이름·볼륨 이름은 compose 프로젝트 기본 네이밍(<프로젝트>_<키>)에
# 맡긴다 — container_name이나 최상위 name:을 고정하면 같은 NAS에서 두 인스턴스가
# 이름 충돌로 동시에 못 뜬다. 기존 prod 볼륨(chosung-daily-prod_mysql-data)에
# 그대로 붙으려면 prod는 프로젝트명 chosung-daily-prod를 계속 써야 한다
# (README "설계 판단" §19).
# ============================================

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: chosung_daily
      MYSQL_USER: chosung
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 개발용 compose와 다르게 포트를 호스트에 안 연다 — app/worker/beat
    # 컨테이너가 도커 내부 네트워크로만 접근하면 되고, 외부에 노출할 이유가 없다.
    # named volume을 쓴다 — Synology DSM의 /volume1 ACL이 호스트 bind mount에는
    # 걸리지만 도커가 관리하는 volume에는 안 걸려서, mysql 컨테이너(uid 999)가
    # 쓰기 권한 없이 뻗는 걸 피한다 (alrimi 프로젝트의 postgres도 같은 이유로 동일 패턴).
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://chosung:${MYSQL_PASSWORD}@mysql:3306/chosung_daily?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      # env 파일의 LOG_DIR 은 **호스트** 폴더(./logs)라서 그대로 두면 Gunicorn 이
      # WORKDIR(/srv) 기준의 /srv/logs/access.log 에 쓴다 — 마운트 밖이라 접속기록이
      # 컨테이너와 함께 사라지고 backup 의 회전·만료 삭제도 안 걸린다. 컨테이너가
      # 보는 값은 마운트의 컨테이너 쪽 경로로 덮는다(environment 가 env_file 을 이긴다).
      LOG_DIR: /logs
      # Caddy 가 믿는 프록시(cloudflared)의 X-Forwarded-For 뒤에 자기 클라이언트 IP 를
      # 덧붙이므로 진짜 클라이언트 IP 는 뒤에서 두 번째다(deploy/Caddyfile).
      PROXY_FIX_X_FOR: 2
    # 호스트 포트는 이 서비스가 아니라 proxy(Caddy)가 잡는다 — app 은 도커 네트워크
    # 안에서만 5000 을 연다. 그래야 롤링 교체(deploy.sh)로 새 app 을 옛 app 옆에
    # 띄울 수 있다(티켓 50). 포트 바인딩이 여기 있던 시절의 컨테이너가 남아 있으면
    # proxy 가 포트를 못 잡는다 — 첫 전환은 docs/RELEASE.md "### 50." 순서대로.
    # SIGTERM 뒤 진행 중 요청(정답 제출)을 마칠 시간. gunicorn graceful_timeout(15초)
    # 보다 길어야 gunicorn 이 먼저 정리하고 도커가 SIGKILL 을 보내지 않는다.
    stop_grace_period: 20s
    # 롤링 교체가 "새 컨테이너가 건강해졌다" 를 이 결과로 판단한다. 이미지에 curl 이
    # 없어서 파이썬으로 /health 를 친다(503 이면 비정상 — 헬스체크 등급은 README §08).
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Gunicorn 접근 로그(접속기록, 고시 제8조)를 호스트 폴더에 쌓는다 — 덤프와
    # 같은 이유로 named volume 이 아니다(컨테이너가 날아가도 보관 기간 동안
    # 남아야 한다). 회전·만료 삭제는 backup 컨테이너가 같은 폴더를 보고 한다.
    volumes:
      - ${LOG_DIR:-./logs}:/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # app 앞 리버스 프록시 — 호스트 포트를 잡고 app 레플리카로 분배한다(티켓 50,
  # 설정은 deploy/Caddyfile). Cloudflare Tunnel이 NAS 안에서
  # http://127.0.0.1:${APP_PORT}로 붙는다 — LAN/인터넷에 직접 노출할 필요가 없어서
  # 루프백에만 바인딩한다(기존 프로젝트들의 0.0.0.0 공개 바인딩보다 한 단계 더 좁힌
  # 선택). prod 8089 / develop 8094 — 포트는 env 파일의 APP_PORT로 갈린다.
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

  worker:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://chosung:${MYSQL_PASSWORD}@mysql:3306/chosung_daily?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "celery", "-A", "celery_app.celery", "worker", "--loglevel=info"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      FLASK_ENV: production
      DATABASE_URL: mysql+pymysql://chosung:${MYSQL_PASSWORD}@mysql:3306/chosung_daily?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "celery", "-A", "celery_app.celery", "beat", "--loglevel=info"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 매일 04:00 KST mysqldump → gzip → 공개키 암호화, ${BACKUP_DIR} 에 14일 보존,
  # 이어서 접근 로그 회전·만료 삭제(티켓 36). 실패하면 Slack.
  # mysql 과 같은 이미지를 쓴다 — mysqldump·gzip·curl·find 가 전부 들어 있고
  # NAS 가 이미 당겨 둔 이미지라 추가로 받을 게 없다 (README "설계 판단" §21).
  backup:
    image: mysql:8
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      BACKUP_AT: "04:00"
      BACKUP_RETENTION_DAYS: 14
      MYSQL_HOST: mysql
      MYSQL_DATABASE: chosung_daily
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ACCESS_LOG_RETENTION_DAYS: ${ACCESS_LOG_RETENTION_DAYS:-365}
      # 이 서비스에는 env_file 이 없다(호스트 경로·앱 시크릿이 섞여 들어온다) —
      # --env-file 에 적어둔 값은 여기 선언한 것만 컨테이너로 간다. 빠지면
      # backup.sh 가 "평문으로 떨어뜨리느니 실패" 규칙대로 덤프를 아예 안 만든다.
      BACKUP_ENCRYPTION_CERT_FILE: ${BACKUP_ENCRYPTION_CERT_FILE:-}
      # 회전 대상은 app 과 같은 컨테이너 쪽 경로다(아래 마운트의 target).
      LOG_DIR: /logs
    entrypoint: ["/bin/bash", "/scripts/backup-cron.sh"]
    # 덤프는 named volume 이 아니라 호스트(NAS) 폴더에 둔다 — 컨테이너·볼륨이
    # 날아가도 DSM 파일 탐색기로 꺼낼 수 있어야 백업이다. 이 컨테이너는 root 로
    # 쓰기 때문에 mysql(uid 999)을 괴롭히는 /volume1 ACL 문제가 없다.
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
      # 접근 로그 파일 회전·만료 삭제를 이 컨테이너의 cron 이 같이 한다(티켓 36).
      - ${LOG_DIR:-./logs}:/logs
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
